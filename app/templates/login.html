<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In · Media Collection Auditor</title><link rel="stylesheet" href="/static/login.css"></head><body><main class="login-scene"><section class="login-panel"><h1>Sign in with Jellyfin</h1><p class="subtitle">Use your Jellyfin account to access Media Collection Auditor.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/login"><label for="username">Username</label><input id="username" name="username" autocomplete="username" maxlength="128" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign In</button></form><p class="note">Jellyfin administrators can manage settings and rescue titles.</p></section></main></body></html>
