<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First-run setup · Media Collection Auditor</title><link rel="stylesheet" href="/static/login.css"></head><body><main class="login-scene"><section class="login-panel"><h1>Set up Media Auditor</h1><p>Find the one-time setup code in this container's Unraid logs. Choose your local administrator account. Scans start in preview mode.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post"><label for="code">One-time setup code</label><input id="code" name="code" type="password" autocomplete="off" required><label for="username">Administrator username</label><input id="username" name="username" autocomplete="username" maxlength="128" required><label for="password">Password (at least 12 characters)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><button type="submit">Create administrator</button></form></section></main></body></html>
