name: JSON worker candidate acceptance
on:
  push:
    branches: [main, feature/unraid, feature/interface-api]
    paths:
      - 'app/**'
      - 'tests/test_json*'
      - 'tests/test_orphan_cleanup.py'
      - 'scripts/json_execution_fixture.py'
      - 'scripts/json_worker_lab.sh'
      - 'scripts/unraid_template_fixture.py'
      - 'unraid/template/media_archiver.xml'
      - 'docker/runtime.Dockerfile'
      - 'docker/runtime-constraints.txt'
      - 'requirements.txt'
      - '.github/workflows/json-worker.yml'
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish only the accepted versioned JSON candidate; production tags are unchanged'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify JSON storage, cycle, controller and browser controls
        env:
          PYTHONPATH: .:app:tests
          WEB_SESSION_SECRET: synthetic-ci-json-session
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m pytest -q tests/test_json_*.py tests/test_orphan_cleanup.py tests/test_arr_title_transport.py tests/test_dashboard_scan_view.py tests/test_docker_runtime_context.py
      - name: Check JSON host wrapper syntax
        run: bash -n scripts/json_worker_lab.sh
      - name: Build exact JSON candidate without publishing
        run: docker build -f docker/runtime.Dockerfile --build-arg SOURCE_REVISION="$GITHUB_SHA" --iidfile "$RUNNER_TEMP/json-worker-image.id" .
      - name: Verify template-only first run and account persistence
        run: |
          mkdir "$RUNNER_TEMP/unraid-empty-appdata"
          docker run --rm -i --network none --read-only --user 0:0 --cap-drop ALL --cap-add DAC_OVERRIDE \
            --security-opt no-new-privileges:true \
            --mount "type=bind,src=$RUNNER_TEMP/unraid-empty-appdata,dst=/app/logs" \
            --entrypoint python "$(cat "$RUNNER_TEMP/json-worker-image.id")" \
            -B - < scripts/unraid_template_fixture.py
      - name: Verify packaged entrypoint, five moves per library and process recovery
        run: bash scripts/json_worker_lab.sh "$(cat "$RUNNER_TEMP/json-worker-image.id")" "$RUNNER_TEMP" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/json-worker-acceptance.log"
      - name: Authenticate candidate publication
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the accepted candidate without rebuilding
        if: inputs.publish
        run: |
          reference="ghcr.io/nvmagma/media_collection_auditor:json-candidate-$GITHUB_SHA"
          docker tag "$(cat "$RUNNER_TEMP/json-worker-image.id")" "$reference"
          docker push "$reference"
          docker image inspect --format '{{json .RepoDigests}}' "$reference" > "$RUNNER_TEMP/json-worker-digests.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: json-worker-evidence
          path: |
            ${{ runner.temp }}/json-worker-image.id
            ${{ runner.temp }}/json-worker-acceptance.log
            ${{ runner.temp }}/json-worker-digests.json
