name: Docker Image

on:
  push:
    branches:
      - feature/unraid
      - feature/sqlite
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      # These checks must pass in THIS job: build-and-push depends on it.
      # Keep other branches' existing publishing behavior unchanged.
      - name: Compile Python source and tests
        if: github.ref == 'refs/heads/feature/unraid' || github.ref == 'refs/heads/feature/sqlite'
        run: python -m compileall -q app tests

      - name: Run web and rescue safety tests
        if: github.ref == 'refs/heads/feature/unraid' || github.ref == 'refs/heads/feature/sqlite'
        env:
          WEB_SESSION_SECRET: ci-only-session-secret
          PYTHONPATH: ${{ github.workspace }}/app
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run SQLite regression tests
        if: github.ref == 'refs/heads/feature/sqlite'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_sqlite_state.py tests/test_sqlite_migration.py tests/test_sqlite_snapshot_writer.py tests/test_sqlite_lock.py tests/test_sqlite_recovery.py tests/test_sqlite_json.py tests/test_sqlite_end_to_end.py tests/test_sqlite_integrity.py tests/test_sqlite_interruptions.py tests/test_sqlite_recovery_integrity.py tests/test_sqlite_restart_persistence.py tests/test_state_store.py tests/test_sqlite_store.py tests/test_sqlite_store_restart.py tests/test_sqlite_concurrency.py tests/test_sqlite_guarded_interface.py tests/test_sqlite_audit_session.py tests/test_sqlite_audit_preflight.py tests/test_sqlite_audit_bootstrap.py tests/test_sqlite_operation_coordinator.py tests/test_sqlite_move_reconciliation.py tests/test_sqlite_recovery_inspection.py tests/test_sqlite_arr_reconciliation.py tests/test_sqlite_recovery_evidence.py tests/test_sqlite_jellyfin_recovery.py tests/test_sqlite_combined_recovery.py tests/test_sqlite_session_recovery.py tests/test_sqlite_checkpoint_failure.py tests/test_sqlite_operation_crash_windows.py tests/test_sqlite_operation_precommit.py tests/test_sqlite_bootstrap_pending.py tests/test_sqlite_readiness.py tests/test_sqlite_readiness_integration.py -v

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app
        run: pytest -c /dev/null test-suite-and-ci/tests -v

  build-and-push:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nvmagma/media_collection_auditor
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
