name: Docker Image
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an accepted versioned JSON image
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  validated-json:
    uses: ./.github/workflows/json-worker.yml
    with:
      publish: ${{ inputs.publish }}
    secrets: inherit
