name: Python safety checks

on:
  push:
    branches: [feature/unraid, feature/sqlite]
  pull_request:
    branches: [feature/unraid, feature/sqlite]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-safety:
    name: Compile and run safety tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q app tests
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run SQLite regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_sqlite_state.py tests/test_sqlite_migration.py tests/test_sqlite_snapshot_writer.py tests/test_sqlite_lock.py tests/test_sqlite_recovery.py tests/test_sqlite_json.py tests/test_sqlite_end_to_end.py tests/test_sqlite_integrity.py tests/test_sqlite_interruptions.py tests/test_sqlite_recovery_integrity.py tests/test_sqlite_restart_persistence.py tests/test_state_store.py -v
      - name: Run isolated safety tests
        env:
          WEB_SESSION_SECRET: ci-only-session-secret
        run: python -m unittest discover -s tests -p 'test_*.py' -v
