name: Python safety checks

on:
  push:
    branches: [feature/unraid, feature/interface-api]
  pull_request:
    branches: [feature/unraid, feature/sqlite, feature/interface-api]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-safety:
    name: Compile and run safety tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Set up JSX test compiler
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            tests/homarr-render/package-lock.json
            tests/dashboard-browser/package-lock.json
      - name: Verify compact Homarr examples
        run: |
          python -B scripts/build_homarr_compact_examples.py --check
          npm ci --prefix tests/homarr-render --ignore-scripts --no-audit --no-fund
          npm test --prefix tests/homarr-render
      - name: Verify dashboard workspace in Chromium
        env:
          WEB_SESSION_SECRET: ci-only-session-secret
          PYTHONPATH: ${{ github.workspace }}/app:${{ github.workspace }}/tests
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/dashboard-browsers
        run: |
          npm ci --prefix tests/dashboard-browser --ignore-scripts --no-audit --no-fund
          tests/dashboard-browser/node_modules/.bin/playwright install --with-deps chromium --only-shell
          python -B tests/dashboard_workspace_case.py "$RUNNER_TEMP/dashboard-workspace.html"
          npm test --prefix tests/dashboard-browser -- "$RUNNER_TEMP/dashboard-workspace.html"
          python -B tests/settings_workspace_case.py "$RUNNER_TEMP/settings-workspace"
          npm run test:settings --prefix tests/dashboard-browser -- "$RUNNER_TEMP/settings-workspace"
          python -B -c 'import os; from pathlib import Path; from settings_workspace_case import render_integration_workspace; Path(os.environ["RUNNER_TEMP"],"integration-setup.html").write_text(render_integration_workspace())'
          npm run test:integrations --prefix tests/dashboard-browser -- "$RUNNER_TEMP/integration-setup.html"
          python -B tests/arr_import_workspace_case.py "$RUNNER_TEMP/arr-imports.html"
          node scripts/test_arr_import_workspace.cjs "$RUNNER_TEMP/arr-imports.html"
      - name: Compile all Python files
        run: python -m compileall -q app tests
      - name: Install pytest
        run: python -m pip install pytest
      - name: Verify read-only retained Arr intent review
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/app:${{ github.workspace }}/tests
        run: python -B -m pytest -q tests/test_sqlite_arr_recovery_review.py tests/test_sqlite_arr_recovery_apply.py tests/test_sqlite_scan_preflight_review.py
      - name: Verify explicit existing-media Arr imports and recovery
        env:
          WEB_SESSION_SECRET: ci-only-session-secret
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/app:${{ github.workspace }}/tests
        run: python -B -m pytest -q tests/test_arr_import_service.py tests/test_arr_import_web.py tests/test_arr_import_transport.py tests/test_json_comparison_candidate.py
      - name: Run preview settings and web availability regressions
        env:
          WEB_SESSION_SECRET: ci-only-session-secret
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/app:${{ github.workspace }}/tests
        run: python -B -m pytest -q tests/test_settings_workspace.py tests/test_sqlite_preview_settings.py tests/test_sqlite_preview_settings_apply.py tests/test_sqlite_preview_settings_apply_web.py tests/test_sqlite_manual_preview_web.py tests/test_unraid_preview_recovery_start.py tests/test_unraid_update_production_prepare.py
      - name: Run dashboard date accuracy and redacted coverage checks
        env:
          WEB_SESSION_SECRET: ci-only-session-secret
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/app:${{ github.workspace }}/tests
        run: python -B -m pytest -q tests/test_dashboard_clocks.py tests/test_dashboard_clock_coverage.py tests/test_dashboard_clock_summary.py tests/test_dashboard_clock_fixture.py tests/test_dashboard_inventory.py tests/test_dashboard_lifecycle_visibility.py tests/test_dashboard_workspace.py tests/test_dashboard_overview.py tests/test_dashboard_scan_view.py tests/test_docker_runtime_context.py
      - name: Run synthetic widget fixture and filter checks
        env:
          WEB_SESSION_SECRET: ci-only-session-secret
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/app:${{ github.workspace }}/tests
        run: python -B -m pytest -q tests/test_homarr_compact_examples.py tests/test_integration_widget_fixture.py tests/test_integration_widget_lab.py tests/test_integration_titles.py
      - name: Run scheduled SQLite acceptance
        if: contains(fromJSON('["feature/sqlite","feature/unraid","feature/interface-api"]'), github.head_ref || github.ref_name)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_sqlite_scheduled*.py tests/test_sqlite_run_schedule.py tests/test_sqlite_backend_gate.py
      - name: Run Gate 9 tracking authority and shipped API regressions
        if: contains(fromJSON('["feature/sqlite","feature/unraid","feature/interface-api"]'), github.head_ref || github.ref_name)
        env:
          WEB_SESSION_SECRET: ci-only-session-secret
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_sqlite_tracking_view*.py tests/test_sqlite_connection_lifetime.py tests/test_sqlite_arr_catalog.py tests/test_sqlite_arr_queue_fixture.py tests/test_sqlite_arr_queue_lab.py tests/test_sqlite_arr_delivery_fixture.py tests/test_sqlite_arr_delivery_lab.py tests/test_sqlite_arr_title_transport.py tests/test_sqlite_arr_completion_fixture.py tests/test_sqlite_arr_completion_lab.py tests/test_sqlite_tv_compatibility_fixture.py tests/test_sqlite_tv_compatibility_lab.py tests/test_sqlite_coordinator_fixture.py tests/test_sqlite_coordinator_authority.py tests/test_sqlite_coordinator_lab.py tests/test_dashboard_tracking_snapshot.py tests/test_dashboard_snapshot_parity.py tests/test_integration*.py tests/test_docker_runtime_context.py
      - name: Run atomic SQLite Gate 7 regression tests
        if: contains(fromJSON('["feature/sqlite","feature/unraid","feature/interface-api"]'), github.head_ref || github.ref_name)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_sqlite_disposable_atomic_reconcile.py tests/test_sqlite_atomic_arr_queue.py tests/test_sqlite_disposable_transaction_failures.py tests/test_sqlite_checkpoint_failure.py
      - name: Run SQLite regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_sqlite_state.py tests/test_sqlite_migration.py tests/test_sqlite_snapshot_writer.py tests/test_sqlite_lock.py tests/test_sqlite_recovery.py tests/test_sqlite_json.py tests/test_sqlite_end_to_end.py tests/test_sqlite_integrity.py tests/test_sqlite_interruptions.py tests/test_sqlite_recovery_integrity.py tests/test_sqlite_restart_persistence.py tests/test_state_store.py tests/test_sqlite_store.py tests/test_sqlite_store_restart.py tests/test_sqlite_concurrency.py tests/test_sqlite_guarded_interface.py tests/test_sqlite_audit_session.py tests/test_sqlite_audit_preflight.py tests/test_sqlite_audit_bootstrap.py tests/test_sqlite_operation_coordinator.py tests/test_sqlite_move_reconciliation.py tests/test_sqlite_recovery_inspection.py tests/test_sqlite_arr_reconciliation.py tests/test_sqlite_recovery_evidence.py tests/test_sqlite_jellyfin_recovery.py tests/test_sqlite_combined_recovery.py tests/test_sqlite_session_recovery.py tests/test_sqlite_checkpoint_failure.py tests/test_sqlite_operation_crash_windows.py tests/test_sqlite_operation_precommit.py tests/test_sqlite_bootstrap_pending.py tests/test_sqlite_readiness.py tests/test_sqlite_readiness_integration.py tests/test_sqlite_offline_rollout.py tests/test_sqlite_full_rehearsal.py tests/test_sqlite_persisted_recovery.py tests/test_sqlite_fetched_recovery.py tests/test_sqlite_recovery_http.py tests/test_sqlite_recovery_multiuser.py tests/test_sqlite_recovery_season_enumeration.py tests/test_sqlite_http_recovery.py tests/test_sqlite_recovery_report.py tests/test_sqlite_recovery_cli.py tests/test_sqlite_recovery_api.py tests/test_sqlite_recovery_view.py tests/test_sqlite_dashboard_integration.py tests/test_sqlite_recovery_guidance.py tests/test_sqlite_recovery_readiness.py tests/test_sqlite_recovery_filesystem.py tests/test_sqlite_recovery_combined.py tests/test_sqlite_recovery_identity.py tests/test_sqlite_recovery_live_identity.py tests/test_sqlite_recovery_path_binding.py tests/test_sqlite_recovery_object_identity.py tests/test_sqlite_recovery_mount_binding.py tests/test_sqlite_recovery_fingerprint.py tests/test_sqlite_recovery_pre_move_evidence.py tests/test_sqlite_recovery_persisted_fingerprint.py tests/test_sqlite_recovery_offline_evidence.py tests/test_sqlite_recovery_decision_matrix.py tests/test_sqlite_recovery_json_rollback.py tests/test_sqlite_migration_interruptions.py tests/test_sqlite_restart_rehearsal.py tests/test_sqlite_disposable_media_restart.py tests/test_sqlite_lab_compose.py tests/test_sqlite_lab_preflight.py tests/test_sqlite_lab_restart_probe.py tests/test_sqlite_lab_intent_rehearsal.py tests/test_sqlite_lab_applied_rehearsal.py tests/test_sqlite_lab_ambiguous_rehearsal.py tests/test_sqlite_lab_destination_inspection.py tests/test_sqlite_lab_missing_inspection.py tests/test_sqlite_recovery_mountinfo.py tests/test_sqlite_recovery_cross_mount.py tests/test_sqlite_lab_fixture_guard.py tests/test_sqlite_disposable_rehearsal.py tests/test_sqlite_lab_mount_probe.py tests/test_sqlite_lab_host_inspect.py -v
      - name: Run isolated safety tests
        env:
          WEB_SESSION_SECRET: ci-only-session-secret
        run: python -m unittest discover -s tests -p 'test_*.py' -v
