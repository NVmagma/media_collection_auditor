name: Python safety checks

on:
  push:
    branches: [feature/unraid, feature/sqlite]
  pull_request:
    branches: [feature/unraid, feature/sqlite]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-safety:
    name: Compile and run safety tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q app tests
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run SQLite regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_sqlite_state.py tests/test_sqlite_migration.py tests/test_sqlite_snapshot_writer.py tests/test_sqlite_lock.py tests/test_sqlite_recovery.py tests/test_sqlite_json.py tests/test_sqlite_end_to_end.py tests/test_sqlite_integrity.py tests/test_sqlite_interruptions.py tests/test_sqlite_recovery_integrity.py tests/test_sqlite_restart_persistence.py tests/test_state_store.py tests/test_sqlite_store.py tests/test_sqlite_store_restart.py tests/test_sqlite_concurrency.py tests/test_sqlite_guarded_interface.py tests/test_sqlite_audit_session.py tests/test_sqlite_audit_preflight.py tests/test_sqlite_audit_bootstrap.py tests/test_sqlite_operation_coordinator.py tests/test_sqlite_move_reconciliation.py tests/test_sqlite_recovery_inspection.py tests/test_sqlite_arr_reconciliation.py tests/test_sqlite_recovery_evidence.py tests/test_sqlite_jellyfin_recovery.py tests/test_sqlite_combined_recovery.py tests/test_sqlite_session_recovery.py tests/test_sqlite_checkpoint_failure.py tests/test_sqlite_operation_crash_windows.py tests/test_sqlite_operation_precommit.py tests/test_sqlite_bootstrap_pending.py tests/test_sqlite_readiness.py tests/test_sqlite_readiness_integration.py tests/test_sqlite_offline_rollout.py tests/test_sqlite_full_rehearsal.py tests/test_sqlite_persisted_recovery.py tests/test_sqlite_fetched_recovery.py tests/test_sqlite_recovery_http.py tests/test_sqlite_recovery_multiuser.py tests/test_sqlite_recovery_season_enumeration.py tests/test_sqlite_http_recovery.py tests/test_sqlite_recovery_report.py tests/test_sqlite_recovery_cli.py tests/test_sqlite_recovery_api.py tests/test_sqlite_recovery_view.py tests/test_sqlite_dashboard_integration.py tests/test_sqlite_recovery_guidance.py tests/test_sqlite_recovery_readiness.py -v
      - name: Run isolated safety tests
        env:
          WEB_SESSION_SECRET: ci-only-session-secret
        run: python -m unittest discover -s tests -p 'test_*.py' -v
